openapi: 3.1.0
info:
  title: Patika Beosztás API
  version: 0.1.5-phase1-hardening
  description: >-
    Az 1.5 hardening fázis frontend–backend szerződése. A futó backend
    /openapi/v1.json dokumentuma a generált frontend típusok végleges forrása.
    A frontend HTTPS-en, az API-val azonos site alatt fusson, és a cookie-s
    kérésekhez credentials: include beállítást használjon.
servers:
  - url: /
tags:
  - name: Auth
  - name: Employees
  - name: Locations
  - name: Users
paths:
  /api/auth/csrf:
    get:
      tags: [Auth]
      summary: CSRF-token kérése
      security: []
      responses:
        '200':
          description: Token és a küldendő header neve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Email/jelszó bejelentkezés
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sikeres munkamenet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          description: A login rate limit kimerült
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Kijelentkezés
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Kijelentkezve
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/auth/session:
    get:
      tags: [Auth]
      summary: Aktuális munkamenet
      responses:
        '200':
          description: Aktív felhasználó munkamenete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /api/admin/employees:
    get:
      tags: [Employees]
      summary: Dolgozók listázása
      x-required-permission: ManageEmployees
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Lapozott dolgozólista
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEmployees'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Employees]
      summary: Dolgozó létrehozása
      x-required-permission: ManageEmployees
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Létrehozott dolgozó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/admin/employees/{id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      tags: [Employees]
      summary: Dolgozó lekérése
      x-required-permission: ManageEmployees
      responses:
        '200':
          description: Dolgozó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags: [Employees]
      summary: Dolgozó módosítása vagy deaktiválása
      x-required-permission: ManageEmployees
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
      responses:
        '200':
          description: Módosított dolgozó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/admin/locations:
    get:
      tags: [Locations]
      summary: Telephelyek listázása
      x-required-permission: ManageLocations
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Lapozott telephelylista
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedLocations'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Locations]
      summary: Telephely létrehozása
      x-required-permission: ManageLocations
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocationRequest'
      responses:
        '201':
          description: Létrehozott telephely
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '422':
          $ref: '#/components/responses/Problem'
  /api/admin/locations/{id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      tags: [Locations]
      summary: Telephely lekérése
      x-required-permission: ManageLocations
      responses:
        '200':
          description: Telephely
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags: [Locations]
      summary: Telephely módosítása vagy deaktiválása
      x-required-permission: ManageLocations
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
      responses:
        '200':
          description: Módosított telephely
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/admin/users:
    get:
      tags: [Users]
      summary: Felhasználók listázása
      x-required-permission: ManageUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Lapozott felhasználólista
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUsers'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Users]
      summary: Helyi Identity-fiók létrehozása
      x-required-permission: ManageUsers
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Létrehozott felhasználó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          $ref: '#/components/responses/Problem'
  /api/admin/users/{id}:
    get:
      tags: [Users]
      summary: Felhasználó részletes lekérése
      x-required-permission: ManageUsers
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Felhasználó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /api/admin/users/{id}/permissions:
    put:
      tags: [Users]
      summary: Permissionök teljes cseréje
      x-required-permission: ManageUsers
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions, expectedVersion]
              properties:
                permissions:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/ApplicationPermission'
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Módosított felhasználó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/admin/users/{id}/employee-link:
    put:
      tags: [Users]
      summary: Dolgozói kapcsolat beállítása vagy törlése
      x-required-permission: ManageUsers
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId, expectedVersion]
              properties:
                employeeId:
                  type: [string, 'null']
                  format: uuid
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Módosított felhasználó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/admin/users/{id}/status:
    put:
      tags: [Users]
      summary: Felhasználó aktiválása vagy deaktiválása
      x-required-permission: ManageUsers
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive, expectedVersion]
              properties:
                isActive:
                  type: boolean
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Módosított felhasználó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-PatikaSession
  parameters:
    CsrfToken:
      in: header
      name: X-CSRF-TOKEN
      required: true
      schema:
        type: string
    EntityId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Search:
      in: query
      name: search
      schema:
        type: [string, 'null']
    IncludeInactive:
      in: query
      name: includeInactive
      schema:
        type: boolean
        default: false
  responses:
    Problem:
      description: RFC 7807 ProblemDetails
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ApplicationPermission:
      type: string
      enum:
        - ViewOwnSchedule
        - ManageOwnLeaveRequests
        - ManageAllLeaveRequests
        - ApproveLeaveRequests
        - ManageEmployees
        - ManageLocations
        - ManageCoverageRules
        - ManageSchedules
        - RunAutoFill
        - UseAiAssistant
        - ManageUsers
    ProfessionalRole:
      type: string
      enum:
        - PharmacyManager
        - Pharmacist
        - SpecialistAssistant
        - Assistant
        - PharmacistTrainee
        - AssistantTrainee
        - Cleaner
        - FinanceHelper
        - Other
    LocationType:
      type: string
      enum: [Central, Branch]
    EmployeeTimeWindowType:
      type: string
      enum: [Preferred, Forbidden]
    TimeType:
      type: string
      enum:
        - Work
        - Overtime
        - OnCallDuty
        - Standby
        - AnnualLeave
        - SickLeave
        - UnpaidLeave
        - ParentalLeave
        - Other
    ProblemDetails:
      type: object
      properties:
        type:
          type: [string, 'null']
        title:
          type: [string, 'null']
        status:
          type: [integer, 'null']
        detail:
          type: [string, 'null']
        instance:
          type: [string, 'null']
        code:
          type: [string, 'null']
        errors:
          type: [array, 'null']
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
              field: { type: [string, 'null'] }
    CsrfTokenResponse:
      type: object
      required: [requestToken, headerName]
      properties:
        requestToken: { type: string }
        headerName: { type: string, const: X-CSRF-TOKEN }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        rememberMe: { type: boolean, default: false }
    LinkedEmployeeSummary:
      type: object
      required: [id, displayName, professionalRole, isActive, isSchedulable]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        professionalRole:
          $ref: '#/components/schemas/ProfessionalRole'
        isActive: { type: boolean }
        isSchedulable: { type: boolean }
    SessionResponse:
      type: object
      required:
        - userId
        - organizationId
        - organizationName
        - organizationTimeZoneId
        - displayName
        - email
        - permissions
        - linkedEmployee
      properties:
        userId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        organizationTimeZoneId:
          type: string
          example: Europe/Budapest
        displayName: { type: string }
        email: { type: string, format: email }
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ApplicationPermission'
        linkedEmployee:
          oneOf:
            - $ref: '#/components/schemas/LinkedEmployeeSummary'
            - type: 'null'
    EmployeeLocationInput:
      type: object
      required: [locationId]
      properties:
        locationId: { type: string, format: uuid }
        enabled: { type: boolean, default: true }
    EmployeeTimeWindowInput:
      type: object
      required: [dayOfWeek, startTime, endTime, type]
      properties:
        dayOfWeek:
          type: [string, 'null']
          enum: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, null]
        startTime: { type: string, format: time }
        endTime: { type: string, format: time }
        type:
          $ref: '#/components/schemas/EmployeeTimeWindowType'
    CreateEmployeeRequest:
      type: object
      required:
        - fullName
        - displayName
        - professionalRole
        - isActive
        - isSchedulable
        - includeInAutoFill
        - countsAsPharmacist
      properties:
        fullName: { type: string, minLength: 1, maxLength: 200 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        professionalRole:
          $ref: '#/components/schemas/ProfessionalRole'
        isActive: { type: boolean }
        isSchedulable: { type: boolean }
        includeInAutoFill: { type: boolean }
        countsAsPharmacist: { type: boolean }
        monthlyMinutesLimit: { type: [integer, 'null'], minimum: 1, maximum: 44640 }
        maxDailyMinutes: { type: [integer, 'null'], minimum: 1, maximum: 1440 }
        birthDate:
          type: [string, 'null']
          format: date
          description: Nem lehet jövőbeli; a legkorábbi elfogadott dátum 1900-01-01.
        externalPayrollId: { type: [string, 'null'], maxLength: 100 }
        locations:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/EmployeeLocationInput'
        timeWindows:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/EmployeeTimeWindowInput'
        allowedTimeTypes:
          type: [array, 'null']
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TimeType'
    UpdateEmployeeRequest:
      allOf:
        - $ref: '#/components/schemas/CreateEmployeeRequest'
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion:
              type: integer
              minimum: 1
    EmployeeLocationResponse:
      type: object
      required: [locationId, locationName, enabled]
      properties:
        locationId: { type: string, format: uuid }
        locationName: { type: string }
        enabled: { type: boolean }
    EmployeeTimeWindowResponse:
      allOf:
        - $ref: '#/components/schemas/EmployeeTimeWindowInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    LinkedUserSummary:
      type: object
      required: [userId, email, displayName, isActive]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        isActive: { type: boolean }
    EmployeeResponse:
      type: object
      required:
        - id
        - fullName
        - displayName
        - professionalRole
        - isActive
        - isSchedulable
        - includeInAutoFill
        - countsAsPharmacist
        - locations
        - timeWindows
        - allowedTimeTypes
        - linkedUser
        - warnings
        - version
        - createdAtUtc
        - updatedAtUtc
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        displayName: { type: string }
        professionalRole:
          $ref: '#/components/schemas/ProfessionalRole'
        isActive: { type: boolean }
        isSchedulable: { type: boolean }
        includeInAutoFill: { type: boolean }
        countsAsPharmacist: { type: boolean }
        monthlyMinutesLimit: { type: [integer, 'null'] }
        maxDailyMinutes: { type: [integer, 'null'] }
        birthDate: { type: [string, 'null'], format: date }
        externalPayrollId: { type: [string, 'null'] }
        locations:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeLocationResponse'
        timeWindows:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeTimeWindowResponse'
        allowedTimeTypes:
          type: array
          items:
            $ref: '#/components/schemas/TimeType'
        linkedUser:
          oneOf:
            - $ref: '#/components/schemas/LinkedUserSummary'
            - type: 'null'
        warnings:
          type: array
          items: { type: string }
        version: { type: integer, minimum: 1 }
        createdAtUtc: { type: string, format: date-time }
        updatedAtUtc: { type: string, format: date-time }
    CreateLocationRequest:
      type: object
      required: [name, type, isActive]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type:
          $ref: '#/components/schemas/LocationType'
        address: { type: [string, 'null'], maxLength: 500 }
        isActive: { type: boolean }
    UpdateLocationRequest:
      allOf:
        - $ref: '#/components/schemas/CreateLocationRequest'
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion: { type: integer, minimum: 1 }
    LocationResponse:
      allOf:
        - $ref: '#/components/schemas/CreateLocationRequest'
        - type: object
          required: [id, version, createdAtUtc, updatedAtUtc]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
            createdAtUtc: { type: string, format: date-time }
            updatedAtUtc: { type: string, format: date-time }
    CreateUserRequest:
      type: object
      required: [email, displayName, initialPassword]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        initialPassword: { type: string, format: password, minLength: 12 }
        employeeId: { type: [string, 'null'], format: uuid }
        permissions:
          type: [array, 'null']
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ApplicationPermission'
        isActive: { type: boolean, default: true }
    UserResponse:
      type: object
      required:
        - id
        - email
        - displayName
        - isActive
        - linkedEmployee
        - permissions
        - version
        - createdAtUtc
        - updatedAtUtc
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        isActive: { type: boolean }
        linkedEmployee:
          oneOf:
            - $ref: '#/components/schemas/LinkedEmployeeSummary'
            - type: 'null'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationPermission'
        version: { type: integer, minimum: 1 }
        createdAtUtc: { type: string, format: date-time }
        updatedAtUtc: { type: string, format: date-time }
    PagedEmployees:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeResponse'
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
    PagedLocations:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LocationResponse'
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
    PagedUsers:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
security:
  - cookieAuth: []
