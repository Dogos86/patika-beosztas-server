openapi: 3.1.0
info:
  title: Patika Beosztás API
  version: 0.4.0-phase2d
  description: >-
    A Phase 2D frontend–backend egyeztetési szerződése. A futó backend
    /openapi/v1.json dokumentuma a generált frontend típusok végleges forrása.
    A 2026-os adókedvezmény-felmérő belső igényfelmérő, nem hivatalos
    NAV-nyilatkozat, nem számít adót és nem állapít meg végleges jogosultságot.
    A frontend HTTPS-en, az API-val azonos site alatt fusson, és a cookie-s
    kérésekhez credentials: include beállítást használjon.
servers:
  - url: /
tags:
  - name: Auth
  - name: Employees
  - name: Locations
  - name: Users
  - name: Work preferences
  - name: Leave requests
  - name: Location opening hours
  - name: Location shift templates
  - name: Coverage requirements
  - name: Employee capabilities
  - name: Employee work profiles
  - name: Employee shift quota rules
  - name: Payroll onboarding
  - name: Tax allowance surveys
  - name: Tax declaration requirements
  - name: Payroll onboarding exports
paths:
  /api/auth/csrf:
    get:
      tags: [Auth]
      summary: CSRF-token kérése
      security: []
      responses:
        '200':
          description: Token és a küldendő header neve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Email/jelszó bejelentkezés
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sikeres munkamenet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          description: A login rate limit kimerült
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Kijelentkezés
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Kijelentkezve
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
  /api/auth/session:
    get:
      tags: [Auth]
      summary: Aktuális munkamenet
      responses:
        '200':
          description: Aktív felhasználó munkamenete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /api/admin/employees:
    get:
      tags: [Employees]
      summary: Dolgozók listázása
      x-required-permission: ManageEmployees
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Lapozott dolgozólista
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEmployees'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Employees]
      summary: Dolgozó létrehozása
      x-required-permission: ManageEmployees
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Létrehozott dolgozó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/admin/employees/{id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      tags: [Employees]
      summary: Dolgozó lekérése
      x-required-permission: ManageEmployees
      responses:
        '200':
          description: Dolgozó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags: [Employees]
      summary: Dolgozó módosítása vagy deaktiválása
      x-required-permission: ManageEmployees
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
      responses:
        '200':
          description: Módosított dolgozó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/admin/locations:
    get:
      tags: [Locations]
      summary: Telephelyek listázása
      x-required-permission: ManageLocations
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Lapozott telephelylista
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedLocations'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Locations]
      summary: Telephely létrehozása
      x-required-permission: ManageLocations
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocationRequest'
      responses:
        '201':
          description: Létrehozott telephely
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '422':
          $ref: '#/components/responses/Problem'
  /api/admin/locations/{id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      tags: [Locations]
      summary: Telephely lekérése
      x-required-permission: ManageLocations
      responses:
        '200':
          description: Telephely
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '404':
          $ref: '#/components/responses/Problem'
    put:
      tags: [Locations]
      summary: Telephely módosítása vagy deaktiválása
      x-required-permission: ManageLocations
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
      responses:
        '200':
          description: Módosított telephely
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/admin/users:
    get:
      tags: [Users]
      summary: Felhasználók listázása
      x-required-permission: ManageUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Lapozott felhasználólista
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUsers'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Users]
      summary: Helyi Identity-fiók létrehozása
      x-required-permission: ManageUsers
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Létrehozott felhasználó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          $ref: '#/components/responses/Problem'
  /api/admin/users/{id}:
    get:
      tags: [Users]
      summary: Felhasználó részletes lekérése
      x-required-permission: ManageUsers
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Felhasználó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /api/admin/users/{id}/permissions:
    put:
      tags: [Users]
      summary: Permissionök teljes cseréje
      x-required-permission: ManageUsers
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions, expectedVersion]
              properties:
                permissions:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/ApplicationPermission'
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Módosított felhasználó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/admin/users/{id}/employee-link:
    put:
      tags: [Users]
      summary: Dolgozói kapcsolat beállítása vagy törlése
      x-required-permission: ManageUsers
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId, expectedVersion]
              properties:
                employeeId:
                  type: [string, 'null']
                  format: uuid
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Módosított felhasználó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/admin/users/{id}/status:
    put:
      tags: [Users]
      summary: Felhasználó aktiválása vagy deaktiválása
      x-required-permission: ManageUsers
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive, expectedVersion]
              properties:
                isActive:
                  type: boolean
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Módosított felhasználó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/me/work-preferences:
    get:
      tags: [Work preferences]
      summary: Saját munkavégzési kérések és szabályok listázása
      parameters:
        - in: query
          name: includeInactive
          schema: { type: [boolean, 'null'], default: false }
      responses:
        '200':
          description: Saját munkavégzési kérések és szabályok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkPreferenceResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Work preferences]
      summary: Saját munkavégzési kérés vagy szabály létrehozása
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkPreferenceRequest'
      responses:
        '201':
          description: Létrehozott munkavégzési kérés vagy szabály
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkPreferenceResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/me/work-preferences/{id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    put:
      tags: [Work preferences]
      summary: Saját munkavégzési kérés vagy szabály módosítása
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkPreferenceRequest'
      responses:
        '200':
          description: Módosított munkavégzési kérés vagy szabály
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkPreferenceResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/me/work-preferences/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    post:
      tags: [Work preferences]
      summary: Saját munkavégzési kérés vagy szabály inaktiválása
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: Inaktivált munkavégzési kérés vagy szabály
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkPreferenceResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/admin/employees/{employeeId}/work-preferences:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    get:
      tags: [Work preferences]
      summary: Dolgozó munkavégzési kéréseinek és szabályainak listázása
      x-required-permission: ManageWorkPreferences
      parameters:
        - in: query
          name: includeInactive
          schema: { type: [boolean, 'null'], default: false }
      responses:
        '200':
          description: Dolgozó munkavégzési kérései és szabályai
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkPreferenceResponse'
        '404':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Work preferences]
      summary: Munkavégzési kérés vagy szabály rögzítése dolgozó számára
      x-required-permission: ManageWorkPreferences
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkPreferenceRequest'
      responses:
        '201':
          description: Létrehozott munkavégzési kérés vagy szabály
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkPreferenceResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/admin/work-preferences/{id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    put:
      tags: [Work preferences]
      summary: Dolgozó munkavégzési kérésének vagy szabályának módosítása
      x-required-permission: ManageWorkPreferences
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkPreferenceRequest'
      responses:
        '200':
          description: Módosított munkavégzési kérés vagy szabály
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkPreferenceResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/admin/work-preferences/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    post:
      tags: [Work preferences]
      summary: Dolgozó munkavégzési kérésének vagy szabályának inaktiválása
      x-required-permission: ManageWorkPreferences
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: Inaktivált munkavégzési kérés vagy szabály
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkPreferenceResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/me/leave-requests:
    get:
      tags: [Leave requests]
      summary: Saját távolléti kérelmek és betegállományok listázása
      x-required-permission: ManageOwnLeaveRequests
      responses:
        '200':
          description: Saját távollétek
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveRequestResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Leave requests]
      summary: Saját távolléti kérelem vagy betegállomány létrehozása
      x-required-permission: ManageOwnLeaveRequests
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeaveRequest'
      responses:
        '201':
          description: Létrehozott távollét
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/me/leave-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    put:
      tags: [Leave requests]
      summary: Saját szerkeszthető távollét módosítása
      x-required-permission: ManageOwnLeaveRequests
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLeaveRequest'
      responses:
        '200':
          description: Módosított távollét
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/me/leave-requests/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    post:
      tags: [Leave requests]
      summary: Saját távolléti kérelem beküldése
      x-required-permission: ManageOwnLeaveRequests
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: Beküldött távolléti kérelem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/me/leave-requests/{id}/withdraw:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    post:
      tags: [Leave requests]
      summary: Saját távolléti kérelem visszavonása
      x-required-permission: ManageOwnLeaveRequests
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: Visszavont távolléti kérelem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/admin/leave-requests:
    get:
      tags: [Leave requests]
      summary: Szervezeti távolléti kérelmek listázása
      x-required-permission: ManageAllLeaveRequests
      parameters:
        - in: query
          name: employeeId
          schema: { type: [string, 'null'], format: uuid }
        - in: query
          name: status
          schema:
            oneOf:
              - $ref: '#/components/schemas/LeaveRequestStatus'
              - type: 'null'
        - in: query
          name: type
          schema:
            oneOf:
              - $ref: '#/components/schemas/LeaveType'
              - type: 'null'
      responses:
        '200':
          description: Szervezeti távollétek
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaveRequestResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /api/admin/leave-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      tags: [Leave requests]
      summary: Távolléti kérelem részletes lekérése
      x-required-permission: ManageAllLeaveRequests
      responses:
        '200':
          description: Távolléti kérelem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /api/admin/employees/{employeeId}/leave-requests:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
    post:
      tags: [Leave requests]
      summary: Távollét rögzítése dolgozó nevében
      x-required-permission: RecordLeaveForOthers
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeaveRequest'
      responses:
        '201':
          description: Létrehozott távollét
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/admin/leave-requests/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    post:
      tags: [Leave requests]
      summary: Admin által rögzített normál kérelem beküldése
      x-required-permission: RecordLeaveForOthers
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
