      x-required-permission: ReviewTaxAllowanceSurvey
      responses:
        '200':
          description: Belső felmérő
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxAllowanceSurveyResponse' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Tax allowance surveys]
      summary: Dolgozó belső felmérőjének upsertje
      x-required-permission: ManagePayrollOnboarding
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTaxAllowanceSurveyRequest' }
      responses:
        '200':
          description: Módosított felmérő
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxAllowanceSurveyResponse' }
        '201':
          description: Létrehozott felmérő
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxAllowanceSurveyResponse' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/admin/tax-allowance-surveys/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    post:
      tags: [Tax allowance surveys]
      summary: Admin által rögzített felmérő beküldése
      x-required-permission: ManagePayrollOnboarding
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxSurveyVersionRequest' }
      responses:
        '200':
          description: Beküldött felmérő
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxAllowanceSurveyResponse' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/admin/tax-allowance-surveys/{id}/reopen:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    post:
      tags: [Tax allowance surveys]
      summary: Felmérő visszanyitása
      x-required-permission: ManagePayrollOnboarding
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxSurveyVersionRequest' }
      responses:
        '200':
          description: Visszanyitott felmérő
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxAllowanceSurveyResponse' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/admin/tax-allowance-surveys/{id}/review:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    post:
      tags: [Tax allowance surveys]
      summary: Felmérő HR/bérszámfejtői ellenőrzése
      x-required-permission: ReviewTaxAllowanceSurvey
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewTaxAllowanceSurveyRequest' }
      responses:
        '200':
          description: Ellenőrzött felmérő
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxAllowanceSurveyResponse' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/admin/tax-allowance-surveys/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    post:
      tags: [Tax allowance surveys]
      summary: Ellenőrzött felmérő lezárása
      x-required-permission: ManagePayrollOnboarding
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxSurveyVersionRequest' }
      responses:
        '200':
          description: Lezárt felmérő
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxAllowanceSurveyResponse' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/admin/employees/{employeeId}/tax-declaration-requirements:
    parameters:
      - $ref: '#/components/parameters/EmployeeId'
      - in: query
        name: surveyId
        schema: { type: [string, 'null'], format: uuid }
    get:
      tags: [Tax declaration requirements]
      summary: Javasolt nyilatkozat-checklist lekérése
      x-required-permission: ReviewTaxAllowanceSurvey
      responses:
        '200':
          description: Checklist
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaxDeclarationRequirementResponse' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/admin/tax-declaration-requirements/{id}/status:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    put:
      tags: [Tax declaration requirements]
      summary: Nyilatkozat workflow-státuszának módosítása
      x-required-permission: ManagePayrollOnboarding
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTaxDeclarationStatusRequest' }
      responses:
        '200':
          description: Módosított checklist-elem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxDeclarationRequirementResponse' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/admin/tax-declaration-requirements/{id}/override:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    put:
      tags: [Tax declaration requirements]
      summary: Nyilatkozat-javaslat kézi felülírása
      x-required-permission: ManagePayrollOnboarding
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverrideTaxDeclarationRequirementRequest' }
      responses:
        '200':
          description: Felülírt checklist-elem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxDeclarationRequirementResponse' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-PatikaSession
  parameters:
    CsrfToken:
      in: header
      name: X-CSRF-TOKEN
      required: true
      schema:
        type: string
    EntityId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    EmployeeId:
      in: path
      name: employeeId
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      in: path
      name: locationId
      required: true
      schema:
        type: string
        format: uuid
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Search:
      in: query
      name: search
      schema:
        type: [string, 'null']
    IncludeInactive:
      in: query
      name: includeInactive
      schema:
        type: boolean
        default: false
  responses:
    Problem:
      description: RFC 7807 ProblemDetails
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ApplicationPermission:
      type: string
      enum:
        - ViewOwnSchedule
        - ManageOwnLeaveRequests
        - ManageWorkPreferences
        - ManageAllLeaveRequests
        - ApproveLeaveRequests
        - RecordLeaveForOthers
        - ManageEmployees
        - ManageLocations
        - ManageCoverageRules
        - ManageSchedules
        - RunAutoFill
        - UseAiAssistant
        - ManageUsers
        - ManagePayrollOnboarding
        - ViewPayrollSensitiveData
        - ReviewTaxAllowanceSurvey
        - ExportPayrollData
    EmployeePayrollProfileStatus:
      type: string
      enum: [Draft, UnderReview, Complete, Archived]
    TaxAllowanceSurveyStatus:
      type: string
      enum: [Draft, Submitted, NeedsClarification, Reviewed, Completed, Cancelled]
    MonthlyAllowancePreference:
      type: string
      enum: [ApplyMonthly, AnnualReturnOnly, NeedsConsultation]
    MaritalStatus:
      type: string
      enum: [Single, Married, Partnership, Divorced, Widowed, Other]
    SurveyAnswer:
      type: string
      enum: [Yes, No, Unknown]
    MotherAllowanceQualifyingChildrenCount:
      type: string
      enum: [None, One, Two, Three, FourPlus, Unknown]
    FamilyAllowanceClaimMode:
      type: string
      enum: [NotRequested, Alone, Shared, Undecided]
    Under25AllowanceOptOut:
      type: string
      enum: [No, Yes, NeedsConsultation]
    ForeignTaxResidencyOrSimilarForeignBenefit:
      type: string
      enum: [None, PresentNeedsConsultation]
    TaxDeclarationType:
      type: string
      enum:
        - Under25OptOut
        - Under30Mother
        - Anyacska
        - MultiChildMotherAllowance
        - FamilyAllowance
        - FirstMarriage
        - PersonalAllowance
    TaxDeclarationRequirementStatus:
      type: string
      enum:
        - NotRequired
        - Required
        - ToSend
        - Sent
        - ReceivedOnya
        - ReceivedPaper
        - Verified
        - Applied
        - Rejected
        - Expired
    ProfessionalRole:
      type: string
      enum:
        - PharmacyManager
        - Pharmacist
        - SpecialistAssistant
        - Assistant
        - PharmacistTrainee
        - AssistantTrainee
        - Cleaner
        - FinanceHelper
        - Other
    LocationType:
      type: string
      enum: [Central, Branch]
    EmployeeTimeWindowType:
      type: string
      enum: [Preferred, Forbidden]
    TimeType:
      type: string
      enum:
        - Work
        - Overtime
        - OnCallDuty
        - Standby
        - AnnualLeave
        - SickLeave
        - UnpaidLeave
        - ParentalLeave
        - Other
    ProblemDetails:
      type: object
      properties:
        type:
          type: [string, 'null']
        title:
          type: [string, 'null']
        status:
          type: [integer, 'null']
        detail:
          type: [string, 'null']
        instance:
          type: [string, 'null']
        code:
          type: [string, 'null']
        errors:
          type: [array, 'null']
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
              field: { type: [string, 'null'] }
    CsrfTokenResponse:
      type: object
      required: [requestToken, headerName]
      properties:
        requestToken: { type: string }
        headerName: { type: string, const: X-CSRF-TOKEN }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        rememberMe: { type: boolean, default: false }
    LinkedEmployeeSummary:
      type: object
      required: [id, displayName, professionalRole, isActive, isSchedulable]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        professionalRole:
          $ref: '#/components/schemas/ProfessionalRole'
        isActive: { type: boolean }
        isSchedulable: { type: boolean }
    SessionResponse:
      type: object
      required:
        - userId
        - organizationId
        - organizationName
        - organizationTimeZoneId
        - displayName
        - email
        - permissions
        - linkedEmployee
      properties:
        userId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        organizationTimeZoneId:
          type: string
          example: Europe/Budapest
        displayName: { type: string }
        email: { type: string, format: email }
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ApplicationPermission'
        linkedEmployee:
          oneOf:
            - $ref: '#/components/schemas/LinkedEmployeeSummary'
            - type: 'null'
    EmployeeLocationInput:
      type: object
      required: [locationId]
      properties:
        locationId: { type: string, format: uuid }
        enabled: { type: boolean, default: true }
    EmployeeTimeWindowInput:
      type: object
      required: [dayOfWeek, startTime, endTime, type]
      properties:
        dayOfWeek:
          type: [string, 'null']
          enum: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, null]
        startTime: { type: string, format: time }
        endTime: { type: string, format: time }
        type:
          $ref: '#/components/schemas/EmployeeTimeWindowType'
    CreateEmployeeRequest:
      type: object
      required:
        - fullName
        - displayName
        - professionalRole
        - isActive
        - isSchedulable
        - includeInAutoFill
        - countsAsPharmacist
      properties:
        fullName: { type: string, minLength: 1, maxLength: 200 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        professionalRole:
          $ref: '#/components/schemas/ProfessionalRole'
        isActive: { type: boolean }
        isSchedulable: { type: boolean }
        includeInAutoFill: { type: boolean }
        countsAsPharmacist: { type: boolean }
        monthlyMinutesLimit: { type: [integer, 'null'], minimum: 1, maximum: 44640 }
        maxDailyMinutes: { type: [integer, 'null'], minimum: 1, maximum: 1440 }
        birthDate:
          type: [string, 'null']
          format: date
          description: Nem lehet jövőbeli; a legkorábbi elfogadott dátum 1900-01-01.
        externalPayrollId: { type: [string, 'null'], maxLength: 100 }
        locations:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/EmployeeLocationInput'
        timeWindows:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/EmployeeTimeWindowInput'
        allowedTimeTypes:
          type: [array, 'null']
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TimeType'
    UpdateEmployeeRequest:
      allOf:
        - $ref: '#/components/schemas/CreateEmployeeRequest'
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion:
              type: integer
              minimum: 1
    EmployeeLocationResponse:
      type: object
      required: [locationId, locationName, enabled]
      properties:
        locationId: { type: string, format: uuid }
        locationName: { type: string }
        enabled: { type: boolean }
    EmployeeTimeWindowResponse:
      allOf:
        - $ref: '#/components/schemas/EmployeeTimeWindowInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    LinkedUserSummary:
      type: object
      required: [userId, email, displayName, isActive]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        isActive: { type: boolean }
    EmployeeResponse:
      type: object
      required:
        - id
        - fullName
        - displayName
        - professionalRole
        - isActive
        - isSchedulable
        - includeInAutoFill
        - countsAsPharmacist
        - locations
        - timeWindows
        - allowedTimeTypes
        - linkedUser
        - warnings
        - version
        - createdAtUtc
        - updatedAtUtc
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        displayName: { type: string }
        professionalRole:
          $ref: '#/components/schemas/ProfessionalRole'
        isActive: { type: boolean }
        isSchedulable: { type: boolean }
        includeInAutoFill: { type: boolean }
        countsAsPharmacist: { type: boolean }
        monthlyMinutesLimit: { type: [integer, 'null'] }
        maxDailyMinutes: { type: [integer, 'null'] }
        birthDate: { type: [string, 'null'], format: date }
        externalPayrollId: { type: [string, 'null'] }
        locations:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeLocationResponse'
        timeWindows:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeTimeWindowResponse'
        allowedTimeTypes:
          type: array
          items:
            $ref: '#/components/schemas/TimeType'
        linkedUser:
          oneOf:
            - $ref: '#/components/schemas/LinkedUserSummary'
            - type: 'null'
        warnings:
          type: array
          items: { type: string }
        version: { type: integer, minimum: 1 }
        createdAtUtc: { type: string, format: date-time }
        updatedAtUtc: { type: string, format: date-time }
    CreateLocationRequest:
      type: object
      required: [name, type, isActive]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type:
          $ref: '#/components/schemas/LocationType'
        address: { type: [string, 'null'], maxLength: 500 }
        isActive: { type: boolean }
    UpdateLocationRequest:
      allOf:
        - $ref: '#/components/schemas/CreateLocationRequest'
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion: { type: integer, minimum: 1 }
    LocationResponse:
      allOf:
        - $ref: '#/components/schemas/CreateLocationRequest'
        - type: object
          required: [id, version, createdAtUtc, updatedAtUtc]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
            createdAtUtc: { type: string, format: date-time }
            updatedAtUtc: { type: string, format: date-time }
    CreateUserRequest:
      type: object
      required: [email, displayName, initialPassword]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        initialPassword: { type: string, format: password, minLength: 12 }
        employeeId: { type: [string, 'null'], format: uuid }
        permissions:
          type: [array, 'null']
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ApplicationPermission'
        isActive: { type: boolean, default: true }
    UserResponse:
      type: object
      required:
        - id
        - email
        - displayName
        - isActive
        - linkedEmployee
        - permissions
        - version
        - createdAtUtc
        - updatedAtUtc
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        isActive: { type: boolean }
        linkedEmployee:
          oneOf:
            - $ref: '#/components/schemas/LinkedEmployeeSummary'
            - type: 'null'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationPermission'
        version: { type: integer, minimum: 1 }
        createdAtUtc: { type: string, format: date-time }
        updatedAtUtc: { type: string, format: date-time }
    WorkPreferenceType:
      type: string
      enum: [Available, Preferred, Avoid, Unavailable, Fixed]
    LeaveType:
      type: string
      enum: [AnnualLeave, SickLeave, UnpaidLeave, ParentalLeave, Other]
    LeaveRequestStatus:
      type: string
      enum: [Draft, Pending, Approved, Rejected, Withdrawn, Cancelled, Reported, Recorded, Closed]
    LeaveDecision:
      type: string
      enum: [Approve, Reject]
    VersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    CreateWorkPreferenceRequest:
      type: object
      additionalProperties: false
      required: [type, dateFrom, dateTo, isFullDay]
      properties:
        type:
          $ref: '#/components/schemas/WorkPreferenceType'
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        dayOfWeek:
          type: [string, 'null']
          enum: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, null]
        isFullDay: { type: boolean }
        startTime: { type: [string, 'null'], format: time }
        endTime: { type: [string, 'null'], format: time }
        locationId: { type: [string, 'null'], format: uuid }
        note: { type: [string, 'null'], maxLength: 1000 }
    UpdateWorkPreferenceRequest:
      allOf:
        - $ref: '#/components/schemas/CreateWorkPreferenceRequest'
        - type: object
          additionalProperties: false
          required: [expectedVersion]
          properties:
            expectedVersion: { type: integer, minimum: 1 }
    WorkPreferenceResponse:
      type: object
      required:
        - id
        - employeeId
        - employeeDisplayName
        - type
        - dateFrom
        - dateTo
        - isFullDay
        - isActive
        - version
        - createdAtUtc
        - updatedAtUtc
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        employeeDisplayName: { type: string }
        type:
          $ref: '#/components/schemas/WorkPreferenceType'
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        dayOfWeek:
          type: [string, 'null']
          enum: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, null]
        isFullDay: { type: boolean }
        startTime: { type: [string, 'null'], format: time }
        endTime: { type: [string, 'null'], format: time }
        locationId: { type: [string, 'null'], format: uuid }
        locationName: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        isActive: { type: boolean }
        version: { type: integer, minimum: 1 }
        createdAtUtc: { type: string, format: date-time }
        updatedAtUtc: { type: string, format: date-time }
    CreateLeaveRequest:
      type: object
      additionalProperties: false
      required: [type, dateFrom, isFullDay]
      description: Betegállománynál az employeeNote nem adható meg; diagnózis nem része a nyilvános szerződésnek.
      properties:
        type:
          $ref: '#/components/schemas/LeaveType'
        dateFrom: { type: string, format: date }
        dateTo: { type: [string, 'null'], format: date }
        isFullDay: { type: boolean }
        startTime: { type: [string, 'null'], format: time }
        endTime: { type: [string, 'null'], format: time }
        employeeNote: { type: [string, 'null'], maxLength: 1000 }
    UpdateLeaveRequest:
      type: object
      additionalProperties: false
      required: [dateFrom, isFullDay, expectedVersion]
      properties:
        dateFrom: { type: string, format: date }
        dateTo: { type: [string, 'null'], format: date }
        isFullDay: { type: boolean }
        startTime: { type: [string, 'null'], format: time }
        endTime: { type: [string, 'null'], format: time }
        employeeNote: { type: [string, 'null'], maxLength: 1000 }
        expectedVersion: { type: integer, minimum: 1 }
    LeaveDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, expectedVersion]
      properties:
        decision:
          $ref: '#/components/schemas/LeaveDecision'
        reason: { type: [string, 'null'], maxLength: 1000 }
        expectedVersion: { type: integer, minimum: 1 }
    CloseSickLeaveRequest:
      type: object
      additionalProperties: false
      required: [dateTo, expectedVersion]
      properties:
        dateTo: { type: string, format: date }
        expectedVersion: { type: integer, minimum: 1 }
    CancelLeaveRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
        expectedVersion: { type: integer, minimum: 1 }
    LeaveStatusHistoryResponse:
      type: object
      required: [toStatus, occurredAtUtc]
      properties:
        fromStatus:
          oneOf:
            - $ref: '#/components/schemas/LeaveRequestStatus'
            - type: 'null'
        toStatus:
          $ref: '#/components/schemas/LeaveRequestStatus'
        occurredAtUtc: { type: string, format: date-time }
        reason: { type: [string, 'null'] }
    LeaveRequestResponse:
      type: object
      required:
        - id
        - employeeId
        - employeeDisplayName
        - type
        - dateFrom
        - isFullDay
        - status
        - statusHistory
        - version
        - createdAtUtc
        - updatedAtUtc
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        employeeDisplayName: { type: string }
        type:
          $ref: '#/components/schemas/LeaveType'
        dateFrom: { type: string, format: date }
        dateTo: { type: [string, 'null'], format: date }
        isFullDay: { type: boolean }
        startTime: { type: [string, 'null'], format: time }
        endTime: { type: [string, 'null'], format: time }
        status:
          $ref: '#/components/schemas/LeaveRequestStatus'
        employeeNote: { type: [string, 'null'] }
        decisionReason: { type: [string, 'null'] }
        statusHistory:
