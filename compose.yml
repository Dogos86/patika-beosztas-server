name: patika-beosztas

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?A POSTGRES_DB értéke kötelező}
      POSTGRES_USER: ${POSTGRES_USER:?A POSTGRES_USER értéke kötelező}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?A POSTGRES_PASSWORD értéke kötelező}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - patika-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  patika-postgres-data:
